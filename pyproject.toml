[project]
name = "dragen-utils"
version = "1.0.0"
description = "Utility commands for pipelines using Illumina Dragen, bundled as a single installable package."
readme = "README.md"
authors = [
    { name = "Bioinformatica Genetica", email = "bioinformatica-genetica@umcutrecht.nl" }
]
requires-python = "~=3.14.0"
dependencies = [
    "jinja2>=3.1.6",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.20",
]

[project.scripts]
dragen-utils = "dragen_utils.cli:cli"

[build-system]
requires = ["uv_build>=0.11.27,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 127

[tool.uv]
required-version = ">=0.11.28"
package=true
exclude-newer = "7 days"
